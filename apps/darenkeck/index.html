<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Daren Keck - personal page with projects, music links, and generative combo visuals."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://darenkeck.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daren Keck" />
    <meta
      property="og:description"
      content="Personal page for Daren Keck with music, links, and live combo visuals."
    />
    <meta property="og:url" content="https://darenkeck.com/" />
    <meta property="og:image" content="https://darenkeck.com/images/written_title_700.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daren Keck" />
    <meta
      name="twitter:description"
      content="Personal page for Daren Keck with music, links, and live combo visuals."
    />
    <meta name="twitter:image" content="https://darenkeck.com/images/written_title_700.webp" />
    <title>darenkeck</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      #app-shell {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        background:
          radial-gradient(1200px 700px at 12% 18%, rgba(55, 63, 66, 0.55), transparent 60%),
          radial-gradient(1000px 640px at 86% 12%, rgba(45, 36, 31, 0.5), transparent 58%),
          linear-gradient(135deg, #111523 0%, #0d1322 100%);
        z-index: 0;
      }

      .app-shell-card {
        position: absolute;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        width: min(calc(100vw - 2rem), 36rem);
      }

      .app-shell-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        transform: translateY(8px);
        margin-bottom: 0.25rem;
        padding: 0 0.25rem;
      }

      .app-shell-spacer {
        width: 152px;
        height: 48px;
      }

      .app-shell-button {
        width: 32px;
        height: 32px;
        border-radius: 0.5rem;
        border: 0;
        background: transparent;
      }

      .app-shell-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      .app-shell-top-loader {
        position: fixed;
        left: 50%;
        top: calc(max(1.5rem, env(safe-area-inset-top)) + 24px);
        transform: translate(-50%, -50%);
      }

      .app-shell-loader-cell {
        width: 18px;
        height: 6px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 3px;
        background: transparent;
        animation: shell-cell-active 2s linear infinite;
      }

      .app-shell-loader-cell:nth-child(2) {
        animation-delay: 0.5s;
      }

      .app-shell-loader-cell:nth-child(3) {
        animation-delay: 1s;
      }

      .app-shell-loader-cell:nth-child(4) {
        animation-delay: 1.5s;
      }

      @keyframes shell-cell-active {
        0%,
        24.999% {
          border-color: rgba(255, 255, 255, 0.95);
          background: rgba(255, 255, 255, 0.95);
        }

        25%,
        100% {
          border-color: rgba(255, 255, 255, 0.55);
          background: transparent;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-shell-loader-cell {
          animation: none;
          border-color: rgba(255, 255, 255, 0.8);
          background: transparent;
        }
      }

      .app-shell-rail {
        height: 2px;
        background: rgba(144, 183, 214, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="app-shell" aria-hidden="true">
      <div class="app-shell-loader app-shell-top-loader">
        <span class="app-shell-loader-cell"></span>
        <span class="app-shell-loader-cell"></span>
        <span class="app-shell-loader-cell"></span>
        <span class="app-shell-loader-cell"></span>
      </div>
      <div class="app-shell-card">
        <div class="app-shell-header">
          <div class="app-shell-spacer"></div>
          <button class="app-shell-button" aria-hidden="true" tabindex="-1"></button>
        </div>
        <div class="app-shell-rail"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
