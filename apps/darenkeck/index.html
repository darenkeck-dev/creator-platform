<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>darenkeck</title>
    <link rel="preload" as="image" href="/images/written_title_700.webp" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      #app-shell {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        background:
          radial-gradient(1200px 700px at 12% 18%, rgba(21, 91, 103, 0.55), transparent 60%),
          radial-gradient(1000px 640px at 86% 12%, rgba(94, 52, 23, 0.5), transparent 58%),
          linear-gradient(135deg, #111523 0%, #0d1322 100%);
        z-index: 0;
      }

      .app-shell-card {
        position: absolute;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        width: min(calc(100vw - 2rem), 36rem);
      }

      .app-shell-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        transform: translateY(8px);
        margin-bottom: 0.25rem;
        padding: 0 0.25rem;
      }

      .app-shell-title {
        height: 48px;
        width: auto;
        display: block;
      }

      .app-shell-button {
        width: 32px;
        height: 32px;
        border-radius: 0.5rem;
        border: 0;
        background: transparent;
      }

      .app-shell-rail {
        height: 2px;
        background: rgba(144, 183, 214, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="app-shell" aria-hidden="true">
      <div class="app-shell-card">
        <div class="app-shell-header">
          <img class="app-shell-title" src="/images/written_title_700.webp" alt="Daren Keck" />
          <button class="app-shell-button" aria-hidden="true" tabindex="-1"></button>
        </div>
        <div class="app-shell-rail"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
