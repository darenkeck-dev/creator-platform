[project]
name = "tone-embedding"
version = "0.1.0"
description = "Generate audio/video tone data and combo training rows."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
essentia = ["essentia-tensorflow"]

[project.scripts]
tone-embedding = "tone_embedding.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
