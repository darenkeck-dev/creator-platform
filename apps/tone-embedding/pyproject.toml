[project]
name = "tone-embedding"
version = "0.1.0"
description = "Generate audio/video tone metadata."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
essentia = ["essentia-tensorflow"]
openai = ["numpy", "openai", "opencv-python-headless", "pillow", "python-dotenv"]
qwen-mps = ["accelerate", "opencv-python-headless", "pillow", "protobuf", "qwen-vl-utils", "sentencepiece", "torch", "torchvision", "transformers"]
video = ["accelerate", "numpy", "open_clip_torch", "openai", "opencv-python-headless", "pillow", "protobuf", "python-dotenv", "qwen-vl-utils", "sentencepiece", "torch", "torchvision", "transformers"]

[project.scripts]
tone-embedding = "tone_embedding.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tone_embedding = ["taxonomies/*.json"]
