[project]
name = "tone-embedding"
version = "0.1.0"
description = "Generate audio/video tone metadata."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
essentia = ["essentia-tensorflow"]
qwen-mps = ["accelerate", "opencv-python-headless", "pillow", "protobuf", "qwen-vl-utils", "sentencepiece", "torch", "torchvision", "transformers"]
video = ["accelerate", "numpy", "open_clip_torch", "opencv-python-headless", "pillow", "protobuf", "qwen-vl-utils", "sentencepiece", "torch", "torchvision", "transformers"]

[project.scripts]
tone-embedding = "tone_embedding.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
